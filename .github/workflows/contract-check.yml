name: Contract Check

# Fails when a generated copy of contract/contract.yaml differs from what
# scripts/contract-gen produces.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Generated copies are current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # contract-gen formats the Terraform it writes
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Check generated copies
        run: scripts/contract-gen --check

      - name: Check the cloud parity page
        run: scripts/parity-gen --check --verify-evidence

      - name: Generator tests
        run: pytest tests/contract tests/docs -q
