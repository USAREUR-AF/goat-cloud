target-version = "py312"
line-length = 120

# Only lint our code, not vendored libraries or testdata
extend-exclude = [
    "modules/aws/compliance-dashboard/lambda/lark",
    "modules/aws/compliance-dashboard/lambda/hcl2",
    "modules/aws/compliance-dashboard/lambda/yaml",
    "modules/aws/compliance-dashboard/lambda/_yaml",
    "modules/aws/compliance-dashboard/lambda/regex",
    "modules/aws/compliance-dashboard/lambda/terraformgraph",
    "modules/aws/compliance-dashboard/lambda/bin",
    "modules/aws/compliance-dashboard/lambda/testdata",
    "local/",
    ".terraform/",
    # shared verbatim with the organization's other repositories
    ".github/leak-gate/",
]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable names (common in short lambdas)
    "B904",   # raise from in except — too noisy for existing code
    "SIM108", # ternary instead of if/else — readability preference
    "SIM116", # dict instead of if/elif — less readable with f-string values
]

[lint.per-file-ignores]
"tests/*" = ["B011", "B018"]  # assert True, useless expressions in tests
"**/lambda/index.py" = ["B023"]  # broad except in Lambda entry points is intentional
"**/lambda/views.py" = ["E402"]  # re-exports after sys.path setup

[format]
quote-style = "double"
indent-style = "space"
