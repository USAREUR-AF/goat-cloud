# Deploys ../../stack with the repository's CI identity. No secret is stored:
# the three ids are repository variables, and the token comes from workload
# identity federation for the GitHub environment "deploy".
#
# The environment "deploy" must allow the branch main only (README, B1):
# Microsoft Entra ID issues the token to any job that names the environment,
# so the environment's branch policy is what keeps other branches out.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-stack
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_resource_group: ${{ vars.STATE_RESOURCE_GROUP }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_INPUT: "false"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_VAR_state_resource_group}" \
            -backend-config="storage_account_name=${TF_VAR_state_storage_account}"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan
