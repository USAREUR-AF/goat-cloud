<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="In a consumer repository the tag module puts the contract tags on every resource, the registry module writes one registry entry that names the state location, a CI job checks tags against the published contract, and a teardown workflow is what expiry teardown dispatches">
<title>In a consumer repository the tag module puts the contract tags on every resource, the registry module writes one registry entry that names the state location, a CI job checks tags against the published contract, and a teardown workflow is what expiry teardown dispatches</title>
<style>
