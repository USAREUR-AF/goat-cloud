<rect class="bg" width="760" height="460" rx="10"/>
<rect x="462" y="56" width="278" height="384" rx="12" class="bxp"/>
<rect x="20" y="56" width="278" height="384" rx="12" class="bxp"/>
<text x="20" y="36" class="t" font-size="18" font-weight="700" data-role="title">A repository joins by adding two modules, one CI job and one workflow</text>
<rect x="34" y="92" width="250" height="76" rx="8" class="bx"/>
<text x="50" y="114" class="t" font-size="15" font-weight="700">Tag module</text>
<text x="50" y="136" class="tq" font-size="13">default tags on the provider</text>
<rect x="476" y="92" width="250" height="76" rx="8" class="bx"/>
<text x="492" y="114" class="t" font-size="15" font-weight="700">Resources</text>
<text x="492" y="136" class="tq" font-size="13">carry the contract tags</text>
<rect x="34" y="178" width="250" height="76" rx="8" class="bx"/>
<text x="50" y="200" class="t" font-size="15" font-weight="700">Registry module</text>
<text x="50" y="222" class="tq" font-size="13">repository, tool, state location</text>
<rect x="476" y="178" width="250" height="76" rx="8" class="bx"/>
<text x="492" y="200" class="t" font-size="15" font-weight="700">Registry entry</text>
<text x="492" y="222" class="tq" font-size="13">tells the scanner</text>
<text x="492" y="240" class="tq" font-size="13">which state to read</text>
<rect x="34" y="264" width="250" height="76" rx="8" class="bx"/>
<text x="50" y="286" class="t" font-size="15" font-weight="700">CI lint job</text>
<text x="50" y="308" class="tq" font-size="13">refuses a change with missing tags</text>
<rect x="476" y="264" width="250" height="76" rx="8" class="bx"/>
<text x="492" y="286" class="t" font-size="15" font-weight="700">Published contract</text>
<text x="492" y="308" class="tq" font-size="13">required keys and accepted values</text>
<rect x="34" y="350" width="250" height="76" rx="8" class="bx"/>
<text x="50" y="372" class="t" font-size="15" font-weight="700">teardown.yml</text>
<text x="50" y="394" class="tq" font-size="13">destroys the stack</text>
<text x="50" y="412" class="tq" font-size="13">when dispatched</text>
<rect x="476" y="350" width="250" height="76" rx="8" class="bx"/>
<text x="492" y="372" class="t" font-size="15" font-weight="700">Expiry teardown</text>
<text x="492" y="394" class="tq" font-size="13">fires at the stack&#x27;s expiry time</text>
<text x="36" y="80.4" class="tq" font-size="13" font-weight="700">example-repo</text>
<text x="478" y="80.4" class="tq" font-size="13" font-weight="700">Cloud account</text>
<path d="M284 130L466.25 130" class="lna"/><path d="M475.25 130L465.25 135L465.25 125z" class="fa"/>
<text x="379.62" y="117" text-anchor="middle" class="tq" font-size="13" font-weight="700">tags</text>
<path d="M284 216L466.25 216" class="lna"/><path d="M475.25 216L465.25 221L465.25 211z" class="fa"/>
<text x="379.62" y="203" text-anchor="middle" class="tq" font-size="13" font-weight="700">writes</text>
<path d="M476 302L292.75 302" class="ln"/><path d="M284.75 302L293.75 297.5L293.75 306.5z" class="fl"/>
<text x="380.38" y="289" text-anchor="middle" class="tq" font-size="13" font-weight="700">read by</text>
<path d="M476 388L292.75 388" class="ln"/><path d="M284.75 388L293.75 383.5L293.75 392.5z" class="fl"/>
<text x="380.38" y="375" text-anchor="middle" class="tq" font-size="13" font-weight="700">dispatches</text>
</svg>
